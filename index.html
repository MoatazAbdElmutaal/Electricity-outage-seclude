<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متابع قطوعات الكهرباء</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 flex flex-col items-center">

  <div class="w-full max-w-md p-4 space-y-4">
    
    <!-- زر ضبط نقطة البداية -->
    <div class="flex justify-between items-center px-1">
      <span class="text-xs text-slate-400 font-medium">نظام دورة: 8 ساعات تشغيل / 8 قطع</span>
      <button onclick="toggleSettings()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
        ⚙️ ضبط البداية
      </button>
    </div>

    <!-- بطاقة الإعدادات (مخفية افتراضياً) -->
    <div id="settingsBox" class="hidden bg-slate-900 border border-slate-700 p-4 rounded-2xl space-y-3">
      <h3 class="text-sm font-bold text-slate-200">تحديد بداية آخر دورة معروفة:</h3>
      <div>
        <label class="text-xs text-slate-400 block mb-1">متى بدأت الدورة؟</label>
        <input type="datetime-local" id="refDateTime" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="text-xs text-slate-400 block mb-1">في ذلك الوقت كانت الكهرباء:</label>
        <select id="refState" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
          <option value="on">شغالة (بدأت 8 ساعات التشغيل)</option>
          <option value="off">قاطعة (بدأت 8 ساعات القطع)</option>
        </select>
      </div>
      <button onclick="saveSettings()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-xl text-sm transition">
        حفظ الإعدادات
      </button>
    </div>

    <!-- النصف العلوي: الحالة الحالية والعد التنازلي -->
    <div id="statusCard" class="relative overflow-hidden rounded-3xl p-6 text-center border transition-all duration-500 shadow-2xl">
      <div id="statusBadge" class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold mb-3 border"></div>
      
      <h1 id="statusTitle" class="text-3xl font-extrabold mb-1">جاري الحساب...</h1>
      <p id="statusSubtitle" class="text-sm opacity-80 mb-6"></p>

      <div class="bg-black/30 backdrop-blur-md rounded-2xl p-4 border border-white/10">
        <span class="text-xs text-slate-300 block mb-1">الوقت المتبقي للتحول القادم:</span>
        <div id="countdown" class="text-3xl font-mono font-bold tracking-wider">00:00:00</div>
      </div>
    </div>

    <!-- شريط الساعات القادمة لليوم -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-200">الجدول للساعات الـ 16 القادمة</h2>
        <span class="text-[11px] text-slate-500">مباشر</span>
      </div>
      <div id="timeline" class="flex gap-2 overflow-x-auto no-scrollbar py-1">
        <!-- تتولد الساعات تلقائياً -->
      </div>
    </div>

    <!-- حاسبة المواعيد والاجتماعات -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
      <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2">
        📅 فحص موعد أو اجتماع قادم
      </h2>
      <p class="text-xs text-slate-400">حدد اليوم والساعة لمعرفة هل الكهرباء ستكون متوفرة أم لا:</p>
      
      <input type="datetime-local" id="checkDateTime" oninput="checkFutureDate()" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">

      <div id="checkResult" class="hidden rounded-xl p-3 border text-center transition">
        <div id="checkResultBadge" class="text-base font-bold mb-1"></div>
        <div id="checkResultDetails" class="text-xs opacity-80"></div>
      </div>
    </div>

  </div>

  <script>
    const CYCLE_HOURS = 16; // 8 تشغيل + 8 قطع
    const BLOCK_HOURS = 8;

    // جلب الإعدادات المحفوظة أو وضع افتراضي
    function getSettings() {
      const stored = localStorage.getItem('power_schedule');
      if (stored) return JSON.parse(stored);
      
      // إعداد افتراضي: بداية اليوم الحالي الساعة 00:00
      const defaultDate = new Date();
      defaultDate.setHours(0, 0, 0, 0);
      return {
        refTime: defaultDate.getTime(),
        refState: 'on'
      };
    }

    function saveSettings() {
      const dateInput = document.getElementById('refDateTime').value;
      const stateInput = document.getElementById('refState').value;
      if (!dateInput) return alert('الرجاء اختيار التاريخ والوقت');

      const data = {
        refTime: new Date(dateInput).getTime(),
        refState: stateInput
      };
      localStorage.setItem('power_schedule', JSON.stringify(data));
      toggleSettings();
      updateAll();
    }

    function toggleSettings() {
      const box = document.getElementById('settingsBox');
      box.classList.toggle('hidden');
    }

    // المعادلة الأساسية لمعرفة الحالة في أي لحظة زمنية
    function calculateState(targetTimestamp) {
      const settings = getSettings();
      const diffMs = targetTimestamp - settings.refTime;
      const diffHours = diffMs / (1000 * 60 * 60);

      // باقي القسمة للتعامل مع الدورات المتكررة
      let cycleOffset = ((diffHours % CYCLE_HOURS) + CYCLE_HOURS) % CYCLE_HOURS;

      let isInitialState = cycleOffset < BLOCK_HOURS;
      let isOn = settings.refState === 'on' ? isInitialState : !isInitialState;

      let hoursIntoBlock = cycleOffset % BLOCK_HOURS;
      let remainingHoursInBlock = BLOCK_HOURS - hoursIntoBlock;

      return {
        isOn: isOn,
        remainingMs: remainingHoursInBlock * 3600 * 1000
      };
    }

    // تحديث النصف العلوي والعد التنازلي
    function updateLiveStatus() {
      const now = Date.now();
      const state = calculateState(now);

      const card = document.getElementById('statusCard');
      const badge = document.getElementById('statusBadge');
      const title = document.getElementById('statusTitle');
      const subtitle = document.getElementById('statusSubtitle');
      const countdown = document.getElementById('countdown');

      if (state.isOn) {
        card.className = "relative overflow-hidden rounded-3xl p-6 text-center border transition-all duration-500 shadow-2xl bg-gradient-to-b from-emerald-950/80 to-slate-900 border-emerald-500/40 text-emerald-400";
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold mb-3 border bg-emerald-500/10 border-emerald-500/30 text-emerald-300";
        badge.innerHTML = "● الكهرباء متصلة";
        title.innerText = "الكهرباء شغالة حالياً ⚡";
        subtitle.innerText = "ساعات التشغيل مستمرة حتى موعد القطع القادم";
      } else {
        card.className = "relative overflow-hidden rounded-3xl p-6 text-center border transition-all duration-500 shadow-2xl bg-gradient-to-b from-rose-950/80 to-slate-900 border-rose-500/40 text-rose-400";
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold mb-3 border bg-rose-500/10 border-rose-500/30 text-rose-300";
        badge.innerHTML = "● في فترة القطع";
        title.innerText = "الكهرباء قاطعة حالياً 🔌";
        subtitle.innerText = "فترة التخفيف سارية حتى موعد عودة الإمداد";
      }

      // حساب الساعات والدقائق والثواني المتبقية
      const totalSec = Math.floor(state.remainingMs / 1000);
      const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      countdown.innerText = `${h}:${m}:${s}`;
    }

    // توليد الشريط الساعي القادم
    function renderTimeline() {
      const container = document.getElementById('timeline');
      container.innerHTML = '';
      const now = new Date();
      now.setMinutes(0, 0, 0);

      for (let i = 0; i < 16; i++) {
        const time = new Date(now.getTime() + i * 3600 * 1000);
        const state = calculateState(time.getTime() + 1000); // إزاحة طفيفة لتفادي الحواف
        const hourStr = time.toLocaleTimeString('ar-EG', { hour: 'numeric', hour12: true });

        const item = document.createElement('div');
        item.className = `flex-shrink-0 w-16 p-2 rounded-xl text-center border ${
          state.isOn 
            ? 'bg-emerald-950/40 border-emerald-800/50 text-emerald-300' 
            : 'bg-rose-950/40 border-rose-800/50 text-rose-300'
        }`;
        item.innerHTML = `
          <div class="text-[10px] text-slate-400 font-medium">${i === 0 ? 'الآن' : hourStr}</div>
          <div class="text-sm mt-1">${state.isOn ? '⚡' : '✕'}</div>
          <div class="text-[10px] font-bold mt-1">${state.isOn ? 'شغالة' : 'قاطعة'}</div>
        `;
        container.appendChild(item);
      }
    }

    // فحص الاجتماعات والمواعيد المستقبلية
    function checkFutureDate() {
      const input = document.getElementById('checkDateTime').value;
      const resBox = document.getElementById('checkResult');
      const resBadge = document.getElementById('checkResultBadge');
      const resDetails = document.getElementById('checkResultDetails');

      if (!input) {
        resBox.classList.add('hidden');
        return;
      }

      const targetTime = new Date(input).getTime();
      const state = calculateState(targetTime);
      const targetDate = new Date(input);

      resBox.classList.remove('hidden');
      if (state.isOn) {
        resBox.className = "rounded-xl p-3 border text-center bg-emerald-950/50 border-emerald-600/50 text-emerald-300";
        resBadge.innerHTML = "✅ الكهرباء حتكون شغالة";
        resDetails.innerHTML = `في توقيت (${targetDate.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})}) الوضع متصل ومناسب للاجتماع.`;
      } else {
        resBox.className = "rounded-xl p-3 border text-center bg-rose-950/50 border-rose-600/50 text-rose-300";
        resBadge.innerHTML = "❌ الكهرباء حتكون قاطعة";
        resDetails.innerHTML = `في توقيت (${targetDate.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})}) حتكون في فترة القطع. يفضل شحن الأجهزة أو تعديل الموعد.`;
      }
    }

    function updateAll() {
      updateLiveStatus();
      renderTimeline();
    }

    // تعبئة حقل التاريخ الافتراضي
    const nowISO = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    document.getElementById('refDateTime').value = nowISO;
    document.getElementById('checkDateTime').min = nowISO;

    // تشغيل العداد
    updateAll();
    setInterval(updateLiveStatus, 1000);
    setInterval(renderTimeline, 60000); // تحديث الشريط كل دقيقة
  </script>
</body>
</html>
